          sed -i 's/^          //' /tmp/road-public.asc
          gpg --batch --import /tmp/road-public.asc
          gpg --batch --with-colons --list-keys "$RECIPIENT_FINGERPRINT" | grep -q '^pub:'

      - name: Fetch and validate organizer archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plaintext encrypted
          curl --location --fail --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --continue-at - \
            --output plaintext/images.zip \
            "$IMAGE_URL"
          unzip -t plaintext/images.zip
          {
            echo "downloaded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            stat --printf='plaintext_size_bytes=%s\n' plaintext/images.zip
            sha256sum plaintext/images.zip | sed 's#plaintext/##'
            unzip -Z1 plaintext/images.zip | wc -l | awk '{print "archive_entries=" $1}'
          } | tee encrypted/download_report.txt

      - name: Encrypt archive before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --yes --trust-model always \
            --recipient "$RECIPIENT_FINGERPRINT" \
            --output encrypted/images.zip.gpg \
            --encrypt plaintext/images.zip
          gpg --list-packets encrypted/images.zip.gpg >/dev/null
          stat --printf='ciphertext_size_bytes=%s\n' encrypted/images.zip.gpg >> encrypted/download_report.txt
          rm -f plaintext/images.zip

      - name: Upload ciphertext-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: road-images-encrypted
          path: encrypted/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
