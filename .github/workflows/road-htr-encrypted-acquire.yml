name: ROAD HTR encrypted acquisition

on:
  pull_request:
    branches:
      - main
    paths:
      - road-htr-trigger/**
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_URL: https://storage.googleapis.com/road-handwriting/images.zip

jobs:
  acquire-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install one-time session public key
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/road-public.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA1PwVxjE4lEswXN/NplZy
          YBiQ70jMwqrbeU0ENoutRFtcmqrGU6EqI4k2r64BgTQ02TEeib+1XTN/JOL2MPeN
          UpyYOcYfqPMKOdR9Nxm2a96yp6jM2zrFCNP0VBUSo07yojNU0VPplPpYi/B6zkYb
          kfPzAHrDV1Tsgbo4gnJtBI5ZCoSGoIw0XNeTsF95ZisPTAXRPBZm70fgPHIrNmyu
          qq1V411WlbjiYRJ1aF40ZZiKGlUQw6ZaSg55KPsPgUp0bGUQZiIN/pijWpIy31yC
          rxIwedv4WweUG+JDMIaVkySXLO2HogJUqva6Q8x/uW300OKug7hi4bGe4mHslZ5k
          36AmfIlYV9a/Ty1jXYg2WU7kPhi5hGfI3lB52UX+wgfWXfL5UC1cSISYln9iLLgi
          HG2MRW5gTvomU/8kPferEqj2e7EEjDvULkF2dXDNS3/qQXYNY+OKXoyIBb/STFC+
          bZj2mcrrNaE405nGN6z/3u86UsCCFMYNk4o3aQ7XPXEHTO8QhqtH1v7LR5MDs3zP
          u3RILtpA2T77a+H14bQDUfq1AsDr1hSIX+VJwHbCRaU5JVsHHOnaIqPOQbMVmoC/
          580mUZahf4H8wA+W+BG1LrKGX3r1McijMSOqHYl3ZxFxBIy3Zu+F58QS1nb5+pVy
          zBVbDwJiIYq3EhrVk6Yt9bkCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          sed -i 's/^          //' /tmp/road-public.pem
          openssl pkey -pubin -in /tmp/road-public.pem -noout -text >/dev/null

      - name: Fetch and validate organiser archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plaintext encrypted secrets
          curl --location --fail --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --continue-at - \
            --output plaintext/images.zip \
            "$IMAGE_URL"
          unzip -t plaintext/images.zip
          {
            echo "downloaded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            stat --printf='plaintext_size_bytes=%s\n' plaintext/images.zip
            sha256sum plaintext/images.zip | sed 's#plaintext/##'
            unzip -Z1 plaintext/images.zip | wc -l | awk '{print "archive_entries=" $1}'
          } | tee encrypted/download_report.txt

      - name: Encrypt and authenticate before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -out secrets/aes.key 32
          openssl rand -out secrets/hmac.key 32
          openssl rand -out secrets/aes.iv 16

          AES_HEX="$(xxd -p -c 256 secrets/aes.key)"
          HMAC_HEX="$(xxd -p -c 256 secrets/hmac.key)"
          IV_HEX="$(xxd -p -c 256 secrets/aes.iv)"

          openssl enc -aes-256-cbc \
            -K "$AES_HEX" -iv "$IV_HEX" \
            -in plaintext/images.zip \
            -out encrypted/images.zip.enc

          openssl dgst -sha256 \
            -mac HMAC -macopt "hexkey:$HMAC_HEX" \
            -binary encrypted/images.zip.enc \
            > encrypted/images.zip.enc.hmac

          cat secrets/aes.key secrets/hmac.key secrets/aes.iv > secrets/keyblob.bin
          test "$(stat -c %s secrets/keyblob.bin)" -eq 80

          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/road-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in secrets/keyblob.bin \
            -out encrypted/keyblob.enc

          {
            echo "encryption=AES-256-CBC"
            echo "authentication=HMAC-SHA256(ciphertext)"
            echo "key_wrap=RSA-4096-OAEP-SHA256"
            stat --printf='ciphertext_size_bytes=%s\n' encrypted/images.zip.enc
            sha256sum encrypted/images.zip.enc encrypted/images.zip.enc.hmac encrypted/keyblob.enc
          } >> encrypted/download_report.txt

          rm -rf plaintext secrets /tmp/road-public.pem
          test ! -e plaintext/images.zip
          test -s encrypted/images.zip.enc
          test -s encrypted/images.zip.enc.hmac
          test -s encrypted/keyblob.enc

      - name: Upload ciphertext-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: road-images-encrypted
          path: encrypted/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
