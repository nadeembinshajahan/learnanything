name: ROAD HTR session acquisition

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/road-htr-session-acquire.yml
      - road-htr-session-trigger.txt

permissions:
  contents: read

env:
  IMAGE_URL: https://storage.googleapis.com/road-handwriting/images.zip

jobs:
  acquire-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install session public key
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/road-public.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAzT/mTmJT2obaITrJEV9x
          r5J43XBFkhgLxUof3WW4vIkg7L1zKN1t2BJyKpToRm2GFlK2EWPXHrZ6+QTogjOz
          np11tqNZYOq+z9Cp1XsY6ZNQ+raoF5U97Xgt9x1a65/G5FMg4qNWkZv027z1hIaw
          HuaY9ysBaVv9gPoGx4WlK0HHNz2zeRoRoXHIRgxOdac85AujY6YS2BrKDuseIloF
          Rdr+NQ1DxUua0SakKZeTWQ/70D8FS4Fk3n6l22fpzeXccem3krTLsibN1qDYaGGF
          D8D39vRe4rO91iIC1PURp3s+/5vO/4FiLPgU4RAxpHCIJ7MpzIZLCN4ua8ZfpvIh
          hnxFet5KdS7sbtKSquM52EaV7dY8qxKgRL4JHqDXp9VqCxSwNyP4YLiqkJAjd9fz
          lgi7RNEfUpF16hpNkuLF7wJye86FYvS0Gf4IJ5ch1FdwC/wTOMLUHXheq7S02W6d
          5BdPuTtj5nAiNTkLzgCPDFVv2UtLy2Zhbh/Llxgxni16tM4uLQuer3Qptjux0h1j
          nOvnUFBFEbUJDQ8BMXFyEE82Bg7TsIuKBUZmwQv/qnLJvFNj7kHvSOOqOeBF4lCB
          AZEea3FV3vmo1C7au6bWzPW3F3Zw31UYI89eJ8fVjfANFDITlSSHCLNnD+iCtfWw
          TG3vBVk6tFgePiqapNFzFL8CAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          sed -i 's/^          //' /tmp/road-public.pem
          openssl pkey -pubin -in /tmp/road-public.pem -noout

      - name: Fetch and validate organiser archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plaintext encrypted
          curl --location --fail --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --continue-at - \
            --output plaintext/images.zip \
            "$IMAGE_URL"
          unzip -t plaintext/images.zip
          {
            echo "downloaded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            stat --printf='plaintext_size_bytes=%s\n' plaintext/images.zip
            sha256sum plaintext/images.zip | sed 's#plaintext/##'
            unzip -Z1 plaintext/images.zip | wc -l | awk '{print "archive_entries=" $1}'
          } > encrypted/download_report.txt

      - name: Encrypt and authenticate archive
        shell: bash
        run: |
          set -euo pipefail
          openssl rand 80 > /tmp/keyblob.bin
          AES_KEY=$(head -c 32 /tmp/keyblob.bin | xxd -p -c 256)
          HMAC_KEY=$(dd if=/tmp/keyblob.bin bs=1 skip=32 count=32 status=none | xxd -p -c 256)
          IV=$(tail -c 16 /tmp/keyblob.bin | xxd -p -c 256)
          openssl enc -aes-256-cbc -nosalt \
            -K "$AES_KEY" -iv "$IV" \
            -in plaintext/images.zip \
            -out encrypted/images.zip.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$HMAC_KEY" \
            -binary encrypted/images.zip.enc > encrypted/images.zip.enc.hmac
          openssl pkeyutl -encrypt -pubin \
            -inkey /tmp/road-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/keyblob.bin \
            -out encrypted/keyblob.enc
          {
            echo "encryption=AES-256-CBC"
            echo "authentication=HMAC-SHA256(ciphertext)"
            echo "key_wrap=RSA-4096-OAEP-SHA256"
            stat --printf='ciphertext_size_bytes=%s\n' encrypted/images.zip.enc
            sha256sum encrypted/images.zip.enc encrypted/images.zip.enc.hmac encrypted/keyblob.enc
          } >> encrypted/download_report.txt
          rm -rf plaintext /tmp/keyblob.bin

      - name: Upload ciphertext-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: road-images-session-encrypted
          path: encrypted/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
